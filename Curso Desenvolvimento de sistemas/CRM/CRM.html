<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="../CSS/CRM.css" />
        <title>CRM-coooll</title>
    </head>

    <body>
        <header>
            <section class="banner">
                <img src="../img/geralt-banner-1036483_1920.jpg" alt="Banner" />

                <div class="texto-banner">
                    <h1>Bem-vindo ao Sistema</h1>
                </div>
            </section>

            <section class="empresa">
                <h3>Vetor</h3>
            </section>
        </header>

        <main>
            <div class="container">
                <h2>Cadastro de Cliente</h2>

                <form>
                    <div class="campo">
                        <label>Nome do Cliente</label>
                        <input type="text" placeholder="Nome do Cliente" />
                    </div>

                    <div class="campo">
                        <label>CPF</label>
                        <input type="text" placeholder="CPF" />
                    </div>

                    <div class="campo">
                        <label>Telefone</label>
                        <input type="text" placeholder="Telefone" />
                    </div>

                    <div class="campo">
                        <label>Email</label>
                        <input type="email" placeholder="Email" />
                    </div>

                    <div class="campo">
                        <label>Cidade</label>
                        <input type="text" placeholder="Cidade" />
                    </div>

                    <div class="campo">
                        <label>Estado</label>
                        <input type="text" placeholder="Estado" />
                    </div>

                    <div class="campo">
                        <label>Data de Cadastro</label>
                        <input type="date" />
                    </div>

                    <div class="campo">
                        <label>Status</label>
                        <select>
                            <option>Ativo</option>
                            <option>Inativo</option>
                        </select>
                    </div>

                    <div class="botao">
                        <button type="submit">Cadastrar</button>
                    </div>
                </form>
            </div>

            <div class="container consulta">
                <h2>Pesquisar Cliente</h2>

                <input type="text" placeholder="Pesquisar Cliente" />

                <button>Pesquisar</button>
                <button>Limpar</button>
            </div>

            <div class="container">
                <table border="1">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>CPF</th>
                            <th>Telefone</th>
                            <th>Email</th>
                            <th>Cidade</th>
                            <th>Estado</th>
                            <th>Status</th>
                        </tr>
                    </thead>

                    <tbody id="listaClientes"></tbody>
                </table>
            </div>

            <div class="container">
                <h2>Relatório de Clientes</h2>

                <button onclick="gerarRelatorio()">Gerar Relatório</button>

                <div id="relatorio" style="display: none">
                    <h3>Relatório</h3>

                    <p>Quantidade de clientes cadastrados: 100</p>
                    <p>Clientes ativos: 80</p>
                    <p>Clientes inativos: 20</p>

                    <button onclick="fecharRelatorio()">Fechar</button>
                </div>
            </div>

            <div class="container">
                <h2>Auditoria</h2>

                <button>Auditar</button>

                <table border="1">
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Cliente</th>
                            <th>Ação</th>
                        </tr>
                    </thead>

                    <tbody></tbody>
                </table>
            </div>
        </main>

        <script>
            function gerarRelatorio() {
                document.getElementById("relatorio").style.display = "block";
            }

            function fecharRelatorio() {
                document.getElementById("relatorio").style.display = "none";
            }
        </script>
    </body>
</html>
